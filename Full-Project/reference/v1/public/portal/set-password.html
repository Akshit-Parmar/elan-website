<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex" name="robots"/><title>Set Password · Élan Summit</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;family=Playfair+Display:wght@600;700;800&amp;display=swap" rel="stylesheet"/><link href="/assets/css/styles.css" rel="stylesheet"/><link href="/assets/css/portal.css" rel="stylesheet"/><!-- Google Analytics 4 --><script async src="https://www.googletagmanager.com/gtag/js?id=G-WD8XZCJC7T"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-WD8XZCJC7T',{anonymize_ip:true});</script>
<link rel="icon" href="/favicon.ico" sizes="48x48"/><link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png"/><link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png"/><link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png"/><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png"/>
</head>
<body><section class="page-hero" style="min-height:100vh;display:grid;place-items:center;padding:40px 0"><div class="container" style="max-width:460px">
<div class="breadcrumb" style="justify-content:center"><span>Élan Summit · Activate portal</span></div>
<article class="white-card"><h2 style="font-family:'Cormorant Garamond',serif;font-size:40px;line-height:.95;margin-bottom:6px">Set your password</h2>
<p class="card-copy" style="margin-bottom:18px">Create a password to activate your participant portal.</p>
<div class="field"><label>Your email</label><input id="em" type="email" autocomplete="email" placeholder="The email you registered with"/></div>
<div class="field" style="margin-top:12px"><label>New password</label><div class="pw-wrap"><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"/><button type="button" class="pw-eye" data-for="pw" aria-label="Show password">&#128065;</button></div></div>
<div class="field" style="margin-top:12px"><label>Confirm password</label><div class="pw-wrap"><input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again"/><button type="button" class="pw-eye" data-for="pw2" aria-label="Show password">&#128065;</button></div></div>
<button class="btn btn-gold" id="setBtn" style="width:100%;margin-top:16px">Set password &amp; enter portal</button>
<div id="msg"></div></article>
<style>.pw-wrap{position:relative}.pw-wrap input{width:100%;padding-right:46px}.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;font-size:18px;cursor:pointer;opacity:.55;padding:6px}.pw-eye:hover{opacity:1}.pw-eye.on{opacity:1}</style>
</div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js"></script><script src="/assets/js/auth.js"></script>
<script>(async function(){var ok=await elanAuth.initSetPassword('msg');document.getElementById('setBtn').disabled=!ok;
  if(ok){try{var s=await elanAuth.client.auth.getSession();window.__sessEmail=(s.data.session&&s.data.session.user&&s.data.session.user.email||'').toLowerCase();}catch(e){}}
})();
document.querySelectorAll('.pw-eye').forEach(function(b){b.addEventListener('click',function(){
  var i=document.getElementById(b.getAttribute('data-for'));
  var show=i.type==='password'; i.type=show?'text':'password'; b.classList.toggle('on',show);
  b.setAttribute('aria-label',show?'Hide password':'Show password');
});});
document.getElementById('setBtn').addEventListener('click',function(){
  var msg=document.getElementById('msg');
  function err(t){msg.innerHTML='<div class="ep-msg err">'+t+'</div>';}
  var em=(document.getElementById('em').value||'').trim().toLowerCase();
  var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  if(!em){err('Enter the email you registered with.');return;}
  if(window.__sessEmail && em!==window.__sessEmail){err('That email doesn\u2019t match this invitation. Use the email your link was sent for.');return;}
  if(!pw||pw.length<8){err('Use at least 8 characters.');return;}
  if(pw!==pw2){err('The two passwords don\u2019t match.');return;}
  elanAuth.setPassword(pw,'msg');
});
</script></body></html>
